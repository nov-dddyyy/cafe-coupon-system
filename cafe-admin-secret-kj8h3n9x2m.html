</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand-logo">Couler</div>
            <h1>할인쿠폰 관리자 페이지</h1>
            <p>쿠폰 발행·조회·통계를 한 곳에서</p>
        </div>

        <div class="tab-nav">
            <button type="button" class="tab-btn active" data-tab="tab-issue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/>
                    <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
                </svg>
                쿠폰 발행
            </button>
            <button type="button" class="tab-btn" data-tab="tab-stats">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
                </svg>
                통계 · 목록
            </button>
        </div>

        <!-- 탭 1: 쿠폰 발행 -->
        <div class="tab-panel active" id="tab-issue">
            <div class="admin-card admin-card--single">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/>
                        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
                    </svg>
                    새 쿠폰 발행
                </div>

                <form id="couponForm">
                    <div class="form-group">
                        <label class="form-label">발행인</label>
                        <div class="issuer-selector">
                            <div class="issuer-option" data-issuer="김용수">김용수</div>
                            <div class="issuer-option" data-issuer="이지원">이지원</div>
                            <div class="issuer-option" data-issuer="김혜빈">김혜빈</div>
                            <div class="issuer-option" data-issuer="김다영">김다영</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">할인율 선택</label>
                        <div class="discount-selector">
                            <div class="discount-option" data-value="5">5%</div>
                            <div class="discount-option" data-value="10">10%</div>
                            <div class="discount-option" data-value="15">15%</div>
                            <div class="discount-option" data-value="20">20%</div>
                            <div class="discount-option discount-custom" data-value="custom">직접입력</div>
                        </div>
                        <div class="discount-stepper" id="discountStepper">
                            <button type="button" class="stepper-btn" id="discountMinus" aria-label="5 감소">−</button>
                            <input type="number" class="form-input discount-custom-input" id="customDiscount" placeholder="5단위 (5~100%)" min="5" max="100" step="5">
                            <button type="button" class="stepper-btn" id="discountPlus" aria-label="5 증가">+</button>
                        </div>
                        <p class="discount-custom-hint" id="customDiscountHint">할인율은 5단위로 입력해주세요 (5, 10, 15 …)</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">지인 이름</label>
                        <div id="friendNamesList">
                            <div class="friend-row">
                                <input type="text" class="form-input friend-name-input" placeholder="예: 김민수">
                                <button type="button" class="row-btn row-btn--remove" aria-label="삭제">−</button>
                            </div>
                        </div>
                        <button type="button" id="addFriendBtn" class="add-friend-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14"/><path d="M12 5v14"/>
                            </svg>
                            지인 추가
                        </button>
                    </div>

                    <div class="form-group">
                        <label class="form-label">메모 (선택사항)</label>
                        <textarea class="form-textarea" id="memo" placeholder="예: 회사 동료, 생일 축하"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        쿠폰 발행하기
                    </button>
                </form>
            </div>
        </div>

        <!-- 탭 2: 통계 · 발행 목록 -->
        <div class="tab-panel" id="tab-stats">
            <!-- 통계 -->
            <div class="admin-card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
                    </svg>
                    쿠폰 통계
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalCoupons">0</div>
                        <div class="stat-label">총 발행</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="usedCoupons">0</div>
                        <div class="stat-label">사용됨</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="unusedCoupons">0</div>
                        <div class="stat-label">미사용</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="usageRate">0%</div>
                        <div class="stat-label">사용률</div>
                    </div>
                </div>

                <div style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">할인율별 사용률</label>
                        <div id="discountStats">
                            <!-- 동적으로 채워집니다 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 쿠폰 목록 -->
            <div class="coupon-list" style="margin-top: 1.5rem;">
            <div class="card-title" style="margin-bottom: 2rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                    <path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
                </svg>
                발행된 쿠폰 목록
            </div>

            <div class="list-controls">
                <select class="form-select" id="filterIssuer">
                    <option value="">전체 발행인</option>
                </select>
                <select class="form-select" id="filterDiscount">
                    <option value="">전체 할인율</option>
                </select>
                <input type="text" class="form-input" id="searchName" placeholder="지인 이름으로 검색">
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">쿠폰 정보를 불러오는 중...</p>
            </div>

            <div id="couponListContainer">
                <!-- 동적으로 채워집니다 -->
            </div>

            <div id="pagination" class="pagination"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/cafe-admin-secret-kj8h3n9x2m.js?v=5"></script>
</body>
</html>
